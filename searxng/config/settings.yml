# SearXNG settings for DocBatch. Everything not listed here keeps SearXNG's defaults.
use_default_settings:
  engines:
    # Web engines used for each search. More engines means each one is asked less often, so blocks are rarer.
    # (Startpage and Mojeek are left out: SearXNG marks them inactive because they challenge automated searches.)
    keep_only:
      - duckduckgo
      - brave
      - bing
      - google
      - qwant
      - yahoo
      - wikipedia
      - wikidata

general:
  instance_name: "DocBatch search"
  enable_metrics: false

server:
  # The real secret comes from SEARXNG_SECRET in .env.
  secret_key: "set-by-environment"
  # Access is controlled by the key check in your reverse proxy, so SearXNG's own bot limiter is off.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  # DocBatch reads results as JSON.
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 100
  pool_maxsize: 20

# SearXNG ships these switched off; turn them on so searches are spread across six web engines.
engines:
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
