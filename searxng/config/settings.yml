# SearXNG settings for DocBatch. Everything not listed here keeps SearXNG's defaults.
use_default_settings:
  engines:
    # Web engines used for each search. Google and Qwant are left out: they refuse servers outright, and waiting
    # on them made the working engines time out. (Startpage and Mojeek are marked inactive by SearXNG itself.)
    keep_only:
      - duckduckgo
      - brave
      - bing
      - yahoo
      - wikipedia
      - wikidata

general:
  instance_name: "DocBatch search"
  enable_metrics: false

server:
  # The real secret comes from SEARXNG_SECRET in .env.
  secret_key: "set-by-environment"
  # Access is controlled by the key check in your reverse proxy, so SearXNG's own bot limiter is off.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  # DocBatch reads results as JSON.
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

# SearXNG ships these switched off; turn them on so searches are spread across six web engines.
engines:
  # Optional: send Bing out through a residential proxy, so it sees a normal home connection instead of this
  # server (DuckDuckGo, Yahoo and Brave spot automated requests whatever the address, so a proxy does not help
  # them). Put the real login only in the server's copy of this file, never in git:
  #   proxies:
  #     all://:
  #       - http://USERNAME:PASSWORD@geo.floppydata.com:10080
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
